<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 NEON ROULETTE — ULTRA</title>
    <style>
        :root {
            --gold: #ffd700;
            --neon-red: #ff3131;
            --neon-black: #1a1a1a;
            --neon-green: #39ff14;
            --neon-blue: #00d2ff;
            --neon-purple: #9d00ff;
            --neon-pink: #ff00ff;
            --neon-orange: #ff8c00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: radial-gradient(ellipse at center, #0a0a15 0%, #000 100%);
            color: white; font-family: 'Segoe UI', sans-serif;
            min-height: 100vh; overflow-x: hidden;
        }

        /* --- ШАПКА --- */
        .header {
            background: rgba(0,0,0,0.9); padding: 15px; text-align: center;
            border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100;
            box-shadow: 0 5px 30px rgba(255,215,0,0.2);
        }
        .header h1 {
            font-size: 24px; letter-spacing: 5px; text-transform: uppercase;
            background: linear-gradient(90deg, var(--gold), #ff8c00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,215,0,0.3);
        }
        .balance-bar {
            display: flex; justify-content: center; gap: 20px; margin-top: 10px;
        }
        .balance-item {
            background: #111; padding: 8px 20px; border-radius: 20px;
            border: 1px solid; font-weight: 900; font-size: 16px;
        }
        .balance-item.gold { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.2); }
        .balance-item.crystals { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 15px rgba(0,210,255,0.2); }

        /* --- КОЛЕСО --- */
        .wheel-section {
            padding: 30px 20px; display: flex; flex-direction: column; align-items: center;
        }

        .wheel-container {
            position: relative; width: 320px; height: 320px; margin-bottom: 30px;
        }

        .wheel-outer {
            position: absolute; inset: 0; border-radius: 50%;
            border: 15px solid #333; box-shadow: 
                0 0 50px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(0,0,0,0.5),
                0 0 30px rgba(255,215,0,0.1);
        }

        .wheel {
            position: absolute; inset: 15px; border-radius: 50%;
            background: conic-gradient(
                var(--neon-red) 0deg 9.73deg,
                var(--neon-black) 9.73deg 19.46deg,
                var(--neon-red) 19.46deg 29.19deg,
                var(--neon-black) 29.19deg 38.92deg,
                var(--neon-red) 38.92deg 48.65deg,
                var(--neon-black) 48.65deg 58.38deg,
                var(--neon-red) 58.38deg 68.11deg,
                var(--neon-black) 68.11deg 77.84deg,
                var(--neon-red) 77.84deg 87.57deg,
                var(--neon-black) 87.57deg 97.3deg,
                var(--neon-red) 97.3deg 107.03deg,
                var(--neon-black) 107.03deg 116.76deg,
                var(--neon-red) 116.76deg 126.49deg,
                var(--neon-black) 126.49deg 136.22deg,
                var(--neon-red) 136.22deg 145.95deg,
                var(--neon-black) 145.95deg 155.68deg,
                var(--neon-red) 155.68deg 165.41deg,
                var(--neon-black) 165.41deg 175.14deg,
                var(--neon-green) 175.14deg 184.87deg,
                var(--neon-black) 184.87deg 194.6deg,
                var(--neon-red) 194.6deg 204.33deg,
                var(--neon-black) 204.33deg 214.06deg,
                var(--neon-red) 214.06deg 223.79deg,
                var(--neon-black) 223.79deg 233.52deg,
                var(--neon-red) 233.52deg 243.25deg,
                var(--neon-black) 243.25deg 252.98deg,
                var(--neon-red) 252.98deg 262.71deg,
                var(--neon-black) 262.71deg 272.44deg,
                var(--neon-red) 272.44deg 282.17deg,
                var(--neon-black) 282.17deg 291.9deg,
                var(--neon-red) 291.9deg 301.63deg,
                var(--neon-black) 301.63deg 311.36deg,
                var(--neon-red) 311.36deg 321.09deg,
                var(--neon-black) 321.09deg 330.82deg,
                var(--neon-red) 330.82deg 340.55deg,
                var(--neon-black) 340.55deg 350.28deg,
                var(--neon-green) 350.28deg 360deg
            );
            transition: transform 5s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .wheel-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: radial-gradient(circle, #333, #000);
            border-radius: 50%; border: 3px solid var(--gold);
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; z-index: 10;
        }

        .ball {
            position: absolute; top: 50%; left: 50%;
            width: 15px; height: 15px; background: radial-gradient(circle at 30% 30%, #fff, #aaa);
            border-radius: 50%; transform: translate(-50%, -140px);
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: all 5s cubic-bezier(0.2, 0, 0.2, 1);
            z-index: 5;
        }

        .pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent;
            border-right: 15px solid transparent; border-top: 30px solid var(--gold);
            filter: drop-shadow(0 0 10px var(--gold)); z-index: 20;
        }

        .win-display {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 72px; font-weight: 900; opacity: 0; pointer-events: none;
            text-shadow: 0 0 50px currentColor; z-index: 30;
            transition: all 0.5s;
        }
        .win-display.show { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }

        /* --- СТАТИСТИКА --- */
        .stats-bar {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;
        }
        .stat-number {
            width: 40px; height: 40px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: 900;
            font-size: 14px; border: 2px solid; animation: fadeIn 0.3s;
        }
        .stat-number.red { background: rgba(255,49,49,0.2); border-color: var(--neon-red); color: var(--neon-red); }
        .stat-number.black { background: rgba(100,100,100,0.2); border-color: #666; color: #fff; }
        .stat-number.green { background: rgba(57,255,20,0.2); border-color: var(--neon-green); color: var(--neon-green); }

        /* --- СТОЛ --- */
        .table-section { padding: 0 10px 20px; }

        .table-grid {
            display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px;
            max-width: 600px; margin: 0 auto; background: #0a3d0a;
            padding: 15px; border-radius: 20px; border: 3px solid #1a5c1a;
            box-shadow: 0 0 50px rgba(57,255,20,0.1), inset 0 0 50px rgba(0,0,0,0.5);
        }

        .cell {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 12px; cursor: pointer; border-radius: 8px;
            transition: all 0.2s; position: relative; border: 1px solid rgba(255,255,255,0.1);
        }
        .cell:hover { transform: scale(1.1); z-index: 10; box-shadow: 0 0 20px currentColor; }
        .cell.selected { animation: pulse 1s infinite; box-shadow: 0 0 30px currentColor; }
        .cell .bet-chip {
            position: absolute; width: 20px; height: 20px; background: var(--gold);
            border-radius: 50%; border: 2px solid #fff; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #000; top: -5px; right: -5px;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .cell.zero { 
            grid-row: span 3; background: var(--neon-green); color: #000;
            border-color: var(--neon-green); box-shadow: 0 0 20px rgba(57,255,20,0.3);
        }
        .cell.red { background: var(--neon-red); color: #fff; }
        .cell.black { background: var(--neon-black); color: #fff; border-color: #444; }

        /* Специальные клетки */
        .special-row {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;
            max-width: 600px; margin: 10px auto 0;
        }
        .special-cell {
            padding: 15px; text-align: center; background: rgba(0,0,0,0.5);
            border: 2px solid #333; border-radius: 10px; cursor: pointer;
            font-weight: 900; font-size: 12px; transition: 0.3s;
        }
        .special-cell:hover { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        .special-cell.selected { background: var(--gold); color: #000; border-color: var(--gold); }

        /* --- УПРАВЛЕНИЕ --- */
        .controls {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.95); padding: 20px; border-top: 2px solid var(--gold);
            display: flex; flex-direction: column; gap: 15px; z-index: 100;
        }

        .bet-amount {
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .bet-amount input {
            background: #111; border: 2px solid #333; color: #fff;
            padding: 15px 25px; border-radius: 15px; font-size: 24px;
            font-weight: 900; text-align: center; width: 150px;
        }
        .bet-amount input:focus { border-color: var(--gold); outline: none; }

        .chip-selector {
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
        }
        .chip {
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 12px; border: 3px dashed;
            transition: 0.3s; position: relative;
        }
        .chip:hover { transform: scale(1.1); }
        .chip.active { border-style: solid; transform: scale(1.2); box-shadow: 0 0 20px currentColor; }
        
        .chip.w { background: #fff; color: #000; border-color: #fff; }
        .chip.r { background: var(--neon-red); color: #fff; border-color: var(--neon-red); }
        .chip.b { background: var(--neon-blue); color: #fff; border-color: var(--neon-blue); }
        .chip.g { background: var(--neon-green); color: #000; border-color: var(--neon-green); }
        .chip.p { background: var(--neon-purple); color: #fff; border-color: var(--neon-purple); }

        .action-btns {
            display: flex; gap: 10px; justify-content: center;
        }
        .action-btn {
            padding: 15px 30px; border: none; border-radius: 15px;
            font-weight: 900; font-size: 14px; cursor: pointer;
            text-transform: uppercase; transition: 0.3s; letter-spacing: 1px;
        }
        .btn-spin {
            background: linear-gradient(135deg, var(--neon-green), #2ecc71);
            color: #000; box-shadow: 0 0 30px rgba(57,255,20,0.4);
            flex: 2;
        }
        .btn-spin:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 40px rgba(57,255,20,0.6); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-clear {
            background: #222; color: #fff; border: 2px solid #444;
        }
        .btn-clear:hover { background: #333; border-color: #666; }

        .btn-repeat {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #fff;
        }

        /* --- РЕЗУЛЬТАТ --- */
        .result-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .result-card {
            background: linear-gradient(135deg, #111, #222); padding: 40px;
            border-radius: 30px; text-align: center; border: 3px solid;
            animation: resultPop 0.5s ease;
        }
        @keyframes resultPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .result-number {
            width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; font-weight: 900; border: 5px solid;
            box-shadow: 0 0 50px currentColor;
        }
        .result-win { color: var(--neon-green); font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .result-lose { color: var(--neon-red); font-size: 32px; font-weight: 900; margin-bottom: 10px; }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- НАЗАД --- */
        .back-btn {
            position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.8);
            color: var(--gold); padding: 10px 20px; border-radius: 20px;
            text-decoration: none; font-weight: 900; border: 1px solid var(--gold);
            z-index: 101; transition: 0.3s;
        }
        .back-btn:hover { background: var(--gold); color: #000; }

        /* --- ЧАСТИЦЫ --- */
        .particle {
            position: fixed; width: 10px; height: 10px; border-radius: 50%;
            pointer-events: none; z-index: 1000;
            animation: particleFly 1s ease-out forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <a href="fortune.html" class="back-btn">← НАЗАД</a>

    <div class="header">
        <h1>🎰 NEON ROULETTE</h1>
        <div class="balance-bar">
            <div class="balance-item gold">🪙 <span id="coins">0</span></div>
            <div class="balance-item crystals">💎 <span id="crys">0</span></div>
        </div>
    </div>

    <!-- СТАТИСТИКА -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- КОЛЕСО -->
    <div class="wheel-section">
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel-outer"></div>
            <div class="wheel" id="wheel"></div>
            <div class="ball" id="ball"></div>
            <div class="wheel-center">🎰</div>
            <div class="win-display" id="winDisplay"></div>
        </div>
    </div>

    <!-- СТОЛ -->
    <div class="table-section">
        <div class="table-grid" id="tableGrid"></div>
        <div class="special-row">
            <div class="special-cell" data-type="1st12">1st 12</div>
            <div class="special-cell" data-type="2nd12">2nd 12</div>
            <div class="special-cell" data-type="3rd12">3rd 12</div>
            <div class="special-cell" data-type="1-18">1-18</div>
            <div class="special-cell" data-type="even">EVEN</div>
            <div class="special-cell" data-type="red" style="background: var(--neon-red);">RED</div>
            <div class="special-cell" data-type="black" style="background: #222;">BLACK</div>
            <div class="special-cell" data-type="odd">ODD</div>
            <div class="special-cell" data-type="19-36">19-36</div>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ -->
    <div class="controls">
        <div class="chip-selector">
            <div class="chip w active" data-value="10">10</div>
            <div class="chip r" data-value="50">50</div>
            <div class="chip b" data-value="100">100</div>
            <div class="chip g" data-value="500">500</div>
            <div class="chip p" data-value="1000">1k</div>
        </div>
        
        <div class="bet-amount">
            <button class="action-btn btn-clear" onclick="clearBets()">🗑️</button>
            <input type="number" id="betInput" value="10" min="10" step="10">
            <button class="action-btn btn-repeat" onclick="repeatBets()">🔄</button>
        </div>
        
        <div class="action-btns">
            <button class="action-btn btn-spin" id="spinBtn" onclick="spin()">🎰 КРУТИТЬ</button>
        </div>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="result-overlay" id="resultOverlay" onclick="this.style.display='none'">
        <div class="result-card" id="resultCard">
            <div class="result-number" id="resultNumber">0</div>
            <div id="resultText"></div>
            <p style="color: #888; margin-top: 15px; font-size: 14px;">Нажмите чтобы продолжить</p>
        </div>
    </div>

<script>
    // --- ДАННЫЕ ---
    const numbers = [
        0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
        5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
    ];
    
    const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    
    let state = {
        coins: +localStorage.getItem("coins") || 100000,
        crys: +localStorage.getItem("crystals") || 10,
        history: JSON.parse(localStorage.getItem("rouletteHistory")) || [],
        currentBets: [],
        lastBets: [],
        isSpinning: false
    };

    let selectedChip = 10;

    // --- ИНИЦИАЛИЗАЦИЯ ---
    init();

    function init() {
        updateBalance();
        renderTable();
        renderStats();
        initChips();
    }

    function updateBalance() {
        document.getElementById("coins").textContent = Math.floor(state.coins).toLocaleString();
        document.getElementById("crys").textContent = state.crys.toLocaleString();
    }

    // --- РЕНДЕР СТОЛА ---
    function renderTable() {
        const grid = document.getElementById("tableGrid");
        
        // Zero
        const zero = document.createElement("div");
        zero.className = "cell zero";
        zero.textContent = "0";
        zero.dataset.num = "0";
        zero.onclick = () => placeBet("num", 0);
        grid.appendChild(zero);
        
        // Numbers 1-36
        for(let row = 3; row >= 1; row--) {
            for(let col = 0; col < 12; col++) {
                const num = (col * 3) + row;
                const cell = document.createElement("div");
                cell.className = `cell ${redNumbers.includes(num) ? 'red' : 'black'}`;
                cell.textContent = num;
                cell.dataset.num = num;
                cell.onclick = () => placeBet("num", num);
                grid.appendChild(cell);
            }
        }
        
        // 2 to 1
        for(let i = 1; i <= 3; i++) {
            const cell = document.createElement("div");
            cell.className = "cell special-cell";
            cell.textContent = "2:1";
            cell.style.gridColumn = "14";
            cell.style.gridRow = i === 1 ? "1" : i === 2 ? "2" : "3";
            cell.onclick = () => placeBet("column", i);
            grid.appendChild(cell);
        }
        
        // Special bets
        document.querySelectorAll(".special-cell").forEach(cell => {
            cell.onclick = () => placeBet("special", cell.dataset.type);
        });
    }

    function renderStats() {
        const bar = document.getElementById("statsBar");
        bar.innerHTML = "";
        state.history.slice(-20).forEach(num => {
            const div = document.createElement("div");
            div.className = `stat-number ${num === 0 ? 'green' : redNumbers.includes(num) ? 'red' : 'black'}`;
            div.textContent = num;
            bar.appendChild(div);
        });
    }

    // --- ФИШКИ ---
    function initChips() {
        document.querySelectorAll(".chip").forEach(chip => {
            chip.onclick = () => {
                document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
                chip.classList.add("active");
                selectedChip = +chip.dataset.value;
                document.getElementById("betInput").value = selectedChip;
            };
        });
    }

    // --- СТАВКИ ---
    function placeBet(type, value) {
        if(state.isSpinning) return;
        
        const amount = +document.getElementById("betInput").value;
        if(amount > state.coins) {
            alert("Недостаточно монет!");
            return;
        }
        
        state.currentBets.push({ type, value, amount });
        state.coins -= amount;
        updateBalance();
        highlightBet(type, value, amount);
        createParticles(event.clientX, event.clientY, "#ffd700");
    }

    function highlightBet(type, value, amount) {
        let selector;
        if(type === "num") selector = `[data-num="${value}"]`;
        else if(type === "special") selector = `[data-type="${value}"]`;
        
        if(selector) {
            const cell = document.querySelector(selector);
            if(cell) {
                cell.classList.add("selected");
                let chip = cell.querySelector(".bet-chip");
                if(!chip) {
                    chip = document.createElement("div");
                    chip.className = "bet-chip";
                    cell.appendChild(chip);
                }
                const current = +chip.textContent || 0;
                chip.textContent = current + amount;
            }
        }
    }

    function clearBets() {
        if(state.isSpinning) return;
        // Вернуть деньги
        state.currentBets.forEach(bet => state.coins += bet.amount);
        state.currentBets = [];
        updateBalance();
        document.querySelectorAll(".selected").forEach(el => {
            el.classList.remove("selected");
            const chip = el.querySelector(".bet-chip");
            if(chip) chip.remove();
        });
    }

    function repeatBets() {
        if(state.lastBets.length === 0) return;
        clearBets();
        state.lastBets.forEach(bet => {
            if(state.coins >= bet.amount) {
                state.coins -= bet.amount;
                state.currentBets.push(bet);
                highlightBet(bet.type, bet.value, bet.amount);
            }
        });
        updateBalance();
    }

    // --- КРУТИТЬ ---
    function spin() {
        if(state.isSpinning) return;
        if(state
