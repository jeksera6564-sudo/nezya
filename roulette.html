<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON ROULETTE — ULTRA</title>
    <style>
        :root {
            --gold: #ffd700;
            --neon-red: #ff3131;
            --neon-black: #1a1a1a;
            --neon-green: #00ff88;
            --neon-blue: #00d2ff;
            --neon-purple: #9d00ff;
            --neon-pink: #ff00ff;
            --table-green: #0d3b1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: radial-gradient(circle at center, #0a0a15 0%, #020205 100%);
            color: white; font-family: 'Segoe UI', sans-serif;
            min-height: 100vh; overflow-x: hidden;
        }

        /* --- БАЛАНС --- */
        .balance-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(0,0,0,0.95); padding: 15px;
            display: flex; justify-content: center; gap: 20px;
            border-bottom: 2px solid #333; backdrop-filter: blur(10px);
        }
        .balance-item {
            background: #111; padding: 12px 25px; border-radius: 15px;
            border: 2px solid; font-weight: 900; font-size: 16px;
            min-width: 140px; text-align: center;
        }
        .balance-item.coins { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        .balance-item.crystals { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 20px rgba(0,210,255,0.2); }

        /* --- КОЛЕСО --- */
        .wheel-container {
            position: relative; height: 350px; display: flex;
            justify-content: center; align-items: center; margin: 20px 0;
        }
        
        .wheel {
            width: 300px; height: 300px; border-radius: 50%;
            position: relative; transform: rotate(0deg);
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.5);
        }
        
        .wheel-number {
            position: absolute; width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 900; font-size: 14px;
            left: 50%; top: 50%; margin: -20px; transform-origin: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .wheel-center {
            position: absolute; width: 80px; height: 80px;
            background: radial-gradient(circle, #333 0%, #000 100%);
            border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%);
            z-index: 10; border: 3px solid var(--gold);
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }
        
        .ball {
            position: absolute; width: 15px; height: 15px;
            background: radial-gradient(circle at 30% 30%, #fff, #aaa);
            border-radius: 50%; left: 50%; top: 50%;
            transform: translate(-50%, -50%); z-index: 15;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: all 3s ease-out;
        }
        
        .pointer {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%); width: 0; height: 0;
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid var(--gold); z-index: 20;
            filter: drop-shadow(0 0 10px var(--gold));
        }

        /* --- СТАТИСТИКА --- */
        .stats-bar {
            display: flex; gap: 10px; padding: 15px; overflow-x: auto;
            background: rgba(0,0,0,0.5); margin: 0 10px 20px; border-radius: 15px;
        }
        .stat-number {
            min-width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px; border: 2px solid;
        }
        .stat-red { background: var(--neon-red); border-color: #ff6666; }
        .stat-black { background: var(--neon-black); border-color: #444; }
        .stat-green { background: var(--neon-green); border-color: #66ffaa; }

        /* --- СТОЛ --- */
        .table-container { padding: 0 10px 20px; }
        
        .roulette-table {
            background: var(--table-green); border-radius: 20px;
            padding: 20px; border: 3px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 40px rgba(0,255,136,0.1), inset 0 0 60px rgba(0,0,0,0.3);
        }

        /* Нулевка */
        .zero-row { display: flex; margin-bottom: 5px; }
        .zero-cell {
            flex: 1; height: 80px; background: var(--neon-green);
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 36px; font-weight: 900;
            border: 3px solid #66ffaa; cursor: pointer; transition: 0.2s;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        .zero-cell:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,255,136,0.5); }

        /* Числа */
        .numbers-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-bottom: 10px; }
        .number-cell {
            aspect-ratio: 1; display: flex; align-items: center;
            justify-content: center; font-weight: 900; font-size: 14px;
            border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .number-cell:hover { transform: scale(1.1); z-index: 10; box-shadow: 0 0 20px currentColor; }
        .number-cell.red { background: linear-gradient(135deg, #cc0000, #ff4444); color: white; }
        .number-cell.black { background: linear-gradient(135deg, #111, #333); color: white; }
        .number-cell.selected { animation: selectedPulse 1s infinite; border-color: var(--gold); }
        
        @keyframes selectedPulse { 0%, 100% { box-shadow: 0 0 10px var(--gold); } 50% { box-shadow: 0 0 25px var(--gold); } }

        /* Фишка на числе */
        .chip {
            position: absolute; width: 25px; height: 25px;
            background: var(--gold); border-radius: 50%;
            border: 3px solid #fff; display: flex; align-items: center;
            justify-content: center; font-size: 10px; font-weight: 900;
            color: #000; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            animation: chipDrop 0.3s ease;
        }
        @keyframes chipDrop { from { transform: scale(0); } to { transform: scale(1); } }

        /* Внешние ставки */
        .outside-bets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }
        .outside-cell {
            padding: 15px 5px; text-align: center; font-weight: 900;
            font-size: 12px; background: rgba(255,255,255,0.1);
            border-radius: 10px; cursor: pointer; transition: 0.2s;
            border: 2px solid rgba(255,255,255,0.1); text-transform: uppercase;
        }
        .outside-cell:hover { background: rgba(255,255,255,0.2); border-color: var(--gold); }

        /* Дюжины/колонки */
        .dozens-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .dozen-cell {
            padding: 20px; text-align: center; font-weight: 900;
            background: rgba(0,0,0,0.3); border-radius: 10px;
            cursor: pointer; border: 2px solid rgba(255,255,255,0.1);
        }
        .dozen-cell:hover { border-color: var(--neon-blue); background: rgba(0,210,255,0.1); }

        /* --- УПРАВЛЕНИЕ --- */
        .controls {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.98); padding: 20px;
            border-top: 2px solid #333; backdrop-filter: blur(20px);
        }
        
        .bet-controls {
            display: flex; gap: 10px; margin-bottom: 15px; align-items: center;
        }
        
        .chip-selector {
            display: flex; gap: 10px;
        }
        .chip-value {
            width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 14px; cursor: pointer;
            border: 3px solid; transition: 0.2s;
        }
        .chip-value.active { transform: scale(1.15); box-shadow: 0 0 20px currentColor; }
        .chip-10 { background: #2196F3; border-color: #64B5F6; }
        .chip-50 { background: #ff9800; border-color: #FFB74D; }
        .chip-100 { background: #f44336; border-color: #E57373; }
        .chip-500 { background: #9c27b0; border-color: #BA68C8; }
        .chip-1k { background: var(--gold); border-color: #FFE082; color: #000; }

        .total-bet {
            flex: 1; text-align: center; font-size: 14px;
        }
        .total-bet b { display: block; font-size: 24px; color: var(--gold); }

        .action-buttons { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; padding: 18px; border-radius: 15px; border: none;
            font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-clear { background: #333; color: #fff; }
        .btn-spin { 
            flex: 2; background: linear-gradient(135deg, var(--neon-green), #00cc6a);
            color: #000; box-shadow: 0 0 30px rgba(0,255,136,0.4);
            animation: spinPulse 2s infinite;
        }
        @keyframes spinPulse { 0%, 100% { box-shadow: 0 0 20px rgba(0,255,136,0.4); } 50% { box-shadow: 0 0 40px rgba(0,255,136,0.7); } }
        .btn-double { background: #444; color: var(--gold); }

        /* --- РЕЗУЛЬТАТ --- */
        .result-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 1000; display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }
        .result-card {
            background: linear-gradient(135deg, #111, #222);
            padding: 50px; border-radius: 30px; text-align: center;
            border: 3px solid var(--gold); box-shadow: 0 0 60px rgba(255,215,0,0.3);
            animation: resultPop 0.5s ease;
        }
        @keyframes resultPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .result-number {
            width: 120px; height: 120px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 60px; font-weight: 900; margin: 0 auto 20px;
            border: 5px solid; box-shadow: 0 0 40px currentColor;
        }
        .result-win { font-size: 48px; color: var(--neon-green); font-weight: 900; text-shadow: 0 0 20px var(--neon-green); }
        .result-lose { font-size: 36px; color: var(--neon-red); }

        /* --- ТРЕКИ --- */
        .track-panel {
            position: fixed; top: 50%; right: 10px; transform: translateY(-50%);
            background: rgba(0,0,0,0.9); padding: 15px; border-radius: 20px;
            border: 2px solid #333; display: none;
        }
        .track-btn {
            display: block; width: 100%; padding: 12px; margin: 5px 0;
            background: #222; border: 1px solid #444; color: #fff;
            border-radius: 10px; cursor: pointer; font-weight: 700;
        }
        .track-btn:hover { border-color: var(--gold); }

        /* --- НАЗАД --- */
        .back-btn {
            position: fixed; top: 80px; left: 10px;
            background: rgba(0,0,0,0.8); padding: 10px 20px;
            border-radius: 10px; color: #fff; text-decoration: none;
            font-weight: 900; border: 1px solid #444; z-index: 50;
        }
        .back-btn:hover { border-color: var(--gold); }

        /* --- АНИМАЦИИ --- */
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <a href="fortune.html" class="back-btn">← НАЗАД</a>

    <!-- БАЛАНС -->
    <div class="balance-bar">
        <div class="balance-item coins">🪙 <span id="coins">0</span></div>
        <div class="balance-item crystals">💎 <span id="crystals">0</span></div>
    </div>

    <!-- КОЛЕСО -->
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="ball" id="ball"></div>
        <div class="wheel-center"></div>
    </div>

    <!-- СТАТИСТИКА -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- СТОЛ -->
    <div class="table-container">
        <div class="roulette-table">
            <!-- Ноль -->
            <div class="zero-row">
                <div class="zero-cell" data-bet="0" onclick="placeBet('0')">0</div>
            </div>
            
            <!-- Числа 1-36 -->
            <div class="numbers-grid" id="numbersGrid"></div>
            
            <!-- 2 к 1 -->
            <div class="dozens-row">
                <div class="dozen-cell" onclick="placeBet('col1')">2 к 1</div>
                <div class="dozen-cell" onclick="placeBet('col2')">2 к 1</div>
                <div class="dozen-cell" onclick="placeBet('col3')">2 к 1</div>
            </div>
            
            <!-- Дюжины -->
            <div class="dozens-row">
                <div class="dozen-cell" onclick="placeBet('doz1')">1-12</div>
                <div class="dozen-cell" onclick="placeBet('doz2')">13-24</div>
                <div class="dozen-cell" onclick="placeBet('doz3')">25-36</div>
            </div>
            
            <!-- Внешние -->
            <div class="outside-bets">
                <div class="outside-cell" onclick="placeBet('small')">1-18</div>
                <div class="outside-cell" onclick="placeBet('even')">ЧЁТ</div>
                <div class="outside-cell" onclick="placeBet('red')" style="color: #ff4444;">🔴 КРАСНОЕ</div>
                <div class="outside-cell" onclick="placeBet('black')" style="color: #888;">⚫ ЧЁРНОЕ</div>
                <div class="outside-cell" onclick="placeBet('odd')">НЕЧЁТ</div>
                <div class="outside-cell" onclick="placeBet('big')">19-36</div>
            </div>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ -->
    <div class="controls">
        <div class="bet-controls">
            <div class="chip-selector">
                <div class="chip-value chip-10 active" onclick="selectChip(10)">10</div>
                <div class="chip-value chip-50" onclick="selectChip(50)">50</div>
                <div class="chip-value chip-100" onclick="selectChip(100)">100</div>
                <div class="chip-value chip-500" onclick="selectChip(500)">500</div>
                <div class="chip-value chip-1k" onclick="selectChip(1000)">1k</div>
            </div>
            <div class="total-bet">
                СТАВКА
                <b id="totalBet">0 🪙</b>
            </div>
        </div>
        <div class="action-buttons">
            <button class="action-btn btn-clear" onclick="clearBets()">🗑️</button>
            <button class="action-btn btn-double" onclick="doubleBets()">×2</button>
            <button class="action-btn btn-spin" onclick="spin()">🎰 КРУТИТЬ</button>
        </div>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="result-overlay" id="resultOverlay" onclick="this.style.display='none'">
        <div class="result-card">
            <div class="result-number" id="resultNumber">0</div>
            <div id="resultText"></div>
            <p style="color: #888; margin-top: 20px; font-size: 14px;">Нажмите чтобы продолжить</p>
        </div>
    </div>

<script>
    // --- ДАННЫЕ ---
    const numbers = [
        {n:0, color:'green'}, {n:1, color:'red'}, {n:2, color:'black'}, {n:3, color:'red'},
        {n:4, color:'black'}, {n:5, color:'red'}, {n:6, color:'black'}, {n:7, color:'red'},
        {n:8, color:'black'}, {n:9, color:'red'}, {n:10, color:'black'}, {n:11, color:'black'},
        {n:12, color:'red'}, {n:13, color:'black'}, {n:14, color:'red'}, {n:15, color:'black'},
        {n:16, color:'red'}, {n:17, color:'black'}, {n:18, color:'red'}, {n:19, color:'red'},
        {n:20, color:'black'}, {n:21, color:'red'}, {n:22, color:'black'}, {n:23, color:'red'},
        {n:24, color:'black'}, {n:25, color:'red'}, {n:26, color:'black'}, {n:27, color:'red'},
        {n:28, color:'black'}, {n:29, color:'black'}, {n:30, color:'red'}, {n:31, color:'black'},
        {n:32, color:'red'}, {n:33, color:'black'}, {n:34, color:'red'}, {n:35, color:'black'},
        {n:36, color:'red'}
    ];

    // Порядок чисел на колесе (европейская)
    const wheelOrder = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

    let state = {
        coins: +localStorage.getItem("coins") || 100000,
        crystals: +localStorage.getItem("crystals") || 10,
        currentChip: 10,
        bets: {},
        history: JSON.parse(localStorage.getItem("rouletteHistory")) || [],
        isSpinning: false
    };

    // --- ИНИЦИАЛИЗАЦИЯ ---
    initWheel();
    renderTable();
    updateUI();
    renderHistory();

    function initWheel() {
        const wheel = document.getElementById('wheel');
        const angleStep = 360 / 37;
        
        wheelOrder.forEach((num, i) => {
            const angle = i * angleStep;
            const el = document.createElement('div');
            el.className = 'wheel-number';
            el.textContent = num;
            el.style.transform = `rotate(${angle}deg) translateY(-120px)`;
            el.style.background = numbers.find(n => n.n === num).color === 'red' ? '#cc0000' : 
                                  numbers.find(n => n.n === num).color === 'black' ? '#111' : '#00ff88';
            wheel.appendChild(el);
        });
    }

    function renderTable() {
        const grid = document.getElementById('numbersGrid');
        for(let i = 1; i <= 36; i++) {
            const num = numbers.find(n => n.n === i);
            const cell = document.createElement('div');
            cell.className = `number-cell ${num.color}`;
            cell.textContent = i;
            cell.dataset.bet = i;
            cell.onclick = () => placeBet(i.toString());
            grid.appendChild(cell);
        }
    }

    function renderHistory() {
        const bar = document.getElementById('statsBar');
        bar.innerHTML = state.history.slice(-12).map(h => {
            const color = numbers.find(n => n.n === h).color;
            return `<div class="stat-number stat-${color}">${h}</div>`;
        }).join('');
    }

    // --- СТАВКИ ---
    function selectChip(value) {
        state.currentChip = value;
        document.querySelectorAll('.chip-value').forEach(c => c.classList.remove('active'));
        document.querySelector(`.chip-${value === 1000 ? '1k' : value}`).classList.add('active');
    }

    function placeBet(bet) {
        if(state.isSpinning) return;
        
        const total = Object.values(state.bets).reduce((a,b) => a+b, 0);
        if(total + state.currentChip > state.coins) {
            showToast("Недостаточно монет!", "error");
            return;
        }

        state.bets[bet] = (state.bets[bet] || 0) + state.currentChip;
        updateBetDisplay(bet);
        updateTotal();
        createChipEffect(event.target);
    }

    function updateBetDisplay(bet) {
        // Найти ячейку и добавить/обновить фишку
        let cell;
        if(bet === '0') cell = document.querySelector('.zero-cell');
        else if(!isNaN(bet)) cell = document.querySelector(`[data-bet="${bet}"]`);
        
        if(cell) {
            let chip = cell.querySelector('.chip');
            if(!chip) {
                chip = document.createElement('div');
                chip.className = 'chip';
                cell.appendChild(chip);
            }
            chip.textContent = state.bets[bet] >= 1000 ? (state.bets[bet]/1000).toFixed(1) + 'k' : state.bets[bet];
        }
    }

    function createChipEffect(target) {
        const chip = document.createElement('div');
        chip.style.cssText = `
            position: fixed; width: 30px; height: 30px; background: var(--gold);
            border-radius: 50%; border: 3px solid #fff; z-index: 1000;
            pointer-events: none; transition: all 0.3s ease;
        `;
        const rect = target.getBoundingClientRect();
        chip.style.left = rect.left + rect.width/2 - 15 + 'px';
        chip.style.top = rect.top + rect.height/2 - 15 + 'px';
        document.body.appendChild(chip);
        
        setTimeout(() => {
            chip.style.transform = 'scale(0)';
            setTimeout(() => chip.remove(), 300);
        }, 100);
    }

    function clearBets() {
        state.bets = {};
        document.querySelectorAll('.chip').forEach(c => c.remove());
        updateTotal();
    }

    function doubleBets() {
        const total = Object.values(state.bets).reduce((a,b) => a+b, 0);
        if(total * 2 > state.coins) {
            showToast("Недостаточно монет!", "error");
            return;
        }
        for(let bet in state.bets) {
            state.bets[bet] *= 2;
            updateBetDisplay(bet);
        }
        updateTotal();
    }

    function updateTotal() {
        const total = Object.values(state.bets).reduce((a,b) => a+b, 0);
        document.getElementById('totalBet').textContent = total.toLocaleString() + ' 🪙';
    }

    // --- КРУЧЕНИЕ ---
    function spin() {
        const total = Object.values(state.bets).reduce((a,b) => a+b, 0);
        if(total === 0) {
            showToast("Сделайте ставку!", "error");
            return;
        }
        if(total > state.coins) {
            showToast("Недостаточно монет!", "error");
            return;
        }

        state.isSpinning = true;
        state.coins -= total;
        updateUI();

               // Анимация
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const winningNum = Math.floor(Math.random() * 37);
        const winningIndex = wheelOrder.indexOf(winningNum);
        const finalAngle = 360 - (winningIndex * (360 / 37)) - (360 / 37 / 2); // Центрируем на числе
        
        const spins = 5 + Math.random() * 3; // 5-8 оборотов
        const totalRotation = spins * 360 + finalAngle;
        
        wheel.style.transform = `rotate(${totalRotation}deg)`;
        
        // Анимация шарика (противоположное направление)
        ball.style.transition = 'all 3s ease-out';
        ball.style.transform = `translate(-50%, -50%) rotate(${-totalRotation * 1.5}deg) translateY(-100px)`;
        
        // Звуковой эффект (если есть)
        playSound('spin');

        setTimeout(() => {
            finishSpin(winningNum);
        }, 4000);
    }

    function finishSpin(winningNum) {
        state.isSpinning = false;
        
        // Рассчет выигрыша
        const winAmount = calculateWin(winningNum);
        const totalBet = Object.values(state.bets).reduce((a,b) => a+b, 0);
        const netWin = winAmount - totalBet;
        
        // Обновление баланса
        if(winAmount > 0) {
            state.coins += winAmount;
            showResult(winningNum, netWin, true);
        } else {
            showResult(winningNum, netWin, false);
        }
        
        // Сохранение истории
        state.history.push(winningNum);
        if(state.history.length > 50) state.history.shift();
        localStorage.setItem("rouletteHistory", JSON.stringify(state.history));
        localStorage.setItem("coins", state.coins);
        
        renderHistory();
        updateUI();
        
        // Сброс ставок
        clearBets();
        
        // Сброс позиции колеса для следующего спина (без анимации)
        setTimeout(() => {
            const wheel = document.getElementById('wheel');
            const ball = document.getElementById('ball');
            wheel.style.transition = 'none';
            ball.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            ball.style.transform = 'translate(-50%, -50%)';
            
            setTimeout(() => {
                wheel.style.transition = 'transform 4s cubic-bezier(0.25, 0.1, 0.25, 1)';
                ball.style.transition = 'all 3s ease-out';
            }, 50);
        }, 500);
    }

    function calculateWin(winningNum) {
        let win = 0;
        const winningNumber = numbers.find(n => n.n === winningNum);
        
        for(let bet in state.bets) {
            const amount = state.bets[bet];
            let multiplier = 0;
            
            // Прямая ставка на число
            if(bet === winningNum.toString()) {
                multiplier = 35;
            }
            // Красное/Черное
            else if(bet === 'red' && winningNumber.color === 'red') {
                multiplier = 1;
            }
            else if(bet === 'black' && winningNumber.color === 'black') {
                multiplier = 1;
            }
            // Чет/Нечет (0 не выигрывает)
            else if(bet === 'even' && winningNum !== 0 && winningNum % 2 === 0) {
                multiplier = 1;
            }
            else if(bet === 'odd' && winningNum !== 0 && winningNum % 2 === 1) {
                multiplier = 1;
            }
            // Малые/Большие (1-18, 19-36)
            else if(bet === 'small' && winningNum >= 1 && winningNum <= 18) {
                multiplier = 1;
            }
            else if(bet === 'big' && winningNum >= 19 && winningNum <= 36) {
                multiplier = 1;
            }
            // Дюжины
            else if(bet === 'doz1' && winningNum >= 1 && winningNum <= 12) {
                multiplier = 2;
            }
            else if(bet === 'doz2' && winningNum >= 13 && winningNum <= 24) {
                multiplier = 2;
            }
            else if(bet === 'doz3' && winningNum >= 25 && winningNum <= 36) {
                multiplier = 2;
            }
            // Колонки
            else if(bet === 'col1' && winningNum % 3 === 1 && winningNum !== 0) {
                multiplier = 2;
            }
            else if(bet === 'col2' && winningNum % 3 === 2) {
                multiplier = 2;
            }
            else if(bet === 'col3' && winningNum % 3 === 0 && winningNum !== 0) {
                multiplier = 2;
            }
            
            if(multiplier > 0) {
                win += amount + (amount * multiplier);
            }
        }
        
        return win;
    }

    function showResult(number, amount, isWin) {
        const overlay = document.getElementById('resultOverlay');
        const numEl = document.getElementById('resultNumber');
        const textEl = document.getElementById('resultText');
        const numData = numbers.find(n => n.n === number);
        
        numEl.textContent = number;
        numEl.className = 'result-number stat-' + numData.color;
        
        if(isWin) {
            textEl.innerHTML = `<div class="result-win">+${amount.toLocaleString()} 🪙</div><div style="color: #888; margin-top: 10px;">ПОБЕДА!</div>`;
            playSound('win');
            
            // Конфетти эффект
            createConfetti();
        } else {
            textEl.innerHTML = `<div class="result-lose">-${Math.abs(amount).toLocaleString()} 🪙</div><div style="color: #666; margin-top: 10px;">ПОПРОБУЙТЕ ЕЩЁ</div>`;
            playSound('lose');
        }
        
        overlay.style.display = 'flex';
    }

    function createConfetti() {
        for(let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.style.cssText = `
                position: fixed; width: 10px; height: 10px; background: hsl(${Math.random() * 360}, 100%, 50%);
                left: ${Math.random() * 100}vw; top: -10px; z-index: 2000;
                animation: confettiFall ${2 + Math.random() * 2}s linear forwards;
            `;
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4000);
        }
    }

    // Добавляем стиль для конфетти
    const style = document.createElement('style');
    style.textContent = `
        @keyframes confettiFall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    `;
    document.head.appendChild(style);

    function updateUI() {
        document.getElementById('coins').textContent = state.coins.toLocaleString();
        document.getElementById('crystals').textContent = state.crystals;
    }

    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        const colors = { error: '#ff3131', success: '#00ff88', info: '#00d2ff' };
        toast.style.cssText = `
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
            background: ${colors[type]}; color: #000; padding: 15px 30px;
            border-radius: 10px; font-weight: 900; z-index: 3000;
            animation: toastSlide 0.3s ease; box-shadow: 0 0 20px ${colors[type]};
        `;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'toastSlide 0.3s ease reverse';
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }

    // Добавляем стиль для тостов
    const toastStyle = document.createElement('style');
    toastStyle.textContent = `
        @keyframes toastSlide {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
    `;
    document.head.appendChild(toastStyle);

    function playSound(type) {
        // Заглушка для звуков - можно добавить реальные звуки
        // const audio = new Audio(`sounds/${type}.mp3`);
        // audio.play().catch(e => console.log('Audio play failed'));
    }

    // Загрузка сохраненных данных при старте
    window.addEventListener('load', () => {
        const savedCoins = localStorage.getItem("coins");
        const savedCrystals = localStorage.getItem("crystals");
        const savedHistory = localStorage.getItem("rouletteHistory");
        
        if(savedCoins) state.coins = parseInt(savedCoins);
        if(savedCrystals) state.crystals = parseInt(savedCrystals);
        if(savedHistory) state.history = JSON.parse(savedHistory);
        
        updateUI();
        renderHistory();
    });

    // Сохранение перед закрытием
    window.addEventListener('beforeunload', () => {
        localStorage.setItem("coins", state.coins);
        localStorage.setItem("crystals", state.crystals);
        localStorage.setItem("rouletteHistory", JSON.stringify(state.history));
    });

    // Обработка ошибок
    window.addEventListener('error', (e) => {
        console.error('Roulette Error:', e);
        showToast('Произошла ошибка!', 'error');
    });
</script>
