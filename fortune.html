<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON CASINO</title>
    <style>
        :root {
            --gold: #ffd700;
            --neon-blue: #00d2ff;
            --neon-purple: #9d00ff;
            --neon-red: #ff4d4d;
            --neon-green: #39ff14;
            --neon-pink: #ff00ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at center, #0a0a15 0%, #020205 100%);
            font-family: 'Segoe UI', sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* Баланс */
        .balance-top { 
            display: flex; gap: 10px; width: 100%; justify-content: center; 
            padding: 10px; background: rgba(0,0,0,0.9); border-bottom: 1px solid #1a1a1a;
        }
        .bal { 
            background: #000; padding: 8px 15px; border-radius: 12px; 
            border: 1px solid; font-weight: 900; font-size: 13px; min-width: 100px; text-align: center;
        }
        .bal.coins { border-color: var(--gold); color: var(--gold); }
        .bal.crystals { border-color: var(--neon-blue); color: var(--neon-blue); }

        /* Пассивный доход */
        .income-bar {
            display: flex; gap: 8px; padding: 8px 15px; margin: 8px 0;
            background: rgba(0,0,0,0.6); border-radius: 12px; border: 1px solid rgba(57,255,20,0.3);
            font-size: 12px; font-weight: 700;
        }
        .income-bar span { color: var(--neon-green); }

        /* Навигация */
        .game-nav { 
            display: flex; gap: 5px; margin: 8px 0; background: #111; 
            padding: 5px; border-radius: 15px; width: 95%; max-width: 400px;
        }
        .nav-btn { 
            flex: 1; padding: 10px 5px; border-radius: 10px; border: none; 
            background: transparent; color: #555; font-weight: 900; 
            cursor: pointer; font-size: 10px; text-transform: uppercase;
        }
        .nav-btn.active { 
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
            color: #fff;
        }

        /* Контент */
        .game-section { display: none; flex-direction: column; align-items: center; width: 100%; padding: 0 10px; }
        .game-section.active { display: flex; }

        /* Колесо */
        .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-tab { 
            padding: 10px 20px; border-radius: 20px; border: 2px solid #222; 
            background: #000; color: #444; cursor: pointer; font-size: 12px; font-weight: 900;
        }
        .mode-tab.active-norm { border-color: var(--neon-green); color: var(--neon-green); }
        .mode-tab.active-vip { border-color: var(--neon-pink); color: var(--neon-pink); }

        .wheel-box { position: relative; width: 280px; height: 280px; margin-bottom: 15px; }
        #wheel-svg { width: 100%; height: 100%; transform: rotate(-90deg); transition: transform 6s cubic-bezier(0.15, 0, 0.1, 1); }
        .pointer { 
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); 
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; 
            border-top: 30px solid #fff; z-index: 20;
        }
        .wheel-border { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            border-radius: 50%; border: 8px solid #111; z-index: 10; pointer-events: none; 
        }
        .norm-glow { border-color: var(--neon-green); }
        .vip-glow { border-color: var(--neon-pink); }

        /* Краш */
        .crash-container { width: 95%; max-width: 400px; }
        .crash-area { 
            height: 250px; background: rgba(0,0,0,0.6); border: 2px solid rgba(0,210,255,0.3); 
            border-radius: 20px; position: relative; overflow: hidden; margin-bottom: 15px;
        }
        .crash-graph { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
        .crash-line { fill: none; stroke: var(--neon-blue); stroke-width: 3; filter: drop-shadow(0 0 5px var(--neon-blue)); }
        .crash-fill { fill: url(#gradient); opacity: 0.3; }
        #rocket { position: absolute; bottom: 10%; left: 10%; font-size: 35px; display: none; filter: drop-shadow(0 0 10px var(--neon-blue)); }
        #multText { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 50px; font-weight: 900; }
        
        .crash-controls { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; }
        .bet-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .crash-input { 
            flex: 1; background: #000; border: 2px solid #333; color: #fff; 
            padding: 12px; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 900;
        }
        .quick-btn { background: #222; border: 1px solid #444; color: #888; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 900; font-size: 11px; }

        /* Рулетка */
        .roulette-preview {
            background: rgba(157,0,255,0.1); border: 2px dashed var(--neon-purple); 
            border-radius: 20px; padding: 30px; text-align: center;
        }
        .roulette-icon { font-size: 60px; margin-bottom: 15px; }
        .roulette-title { font-size: 24px; font-weight: 900; color: var(--neon-purple); margin-bottom: 10px; }
        .roulette-features { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .roulette-feature { background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 10px; font-size: 11px; }

        /* Кнопки */
        .main-btn { 
            width: 100%; padding: 15px; border-radius: 15px; border: none; 
            font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase;
        }
        .btn-spin { background: linear-gradient(135deg, var(--neon-green), #2ecc71); color: #000; }
        .btn-free { background: linear-gradient(135deg, var(--gold), var(--neon-orange)); color: #000; }
        .btn-vip { background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); color: #fff; }
        .btn-crash { background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); color: #fff; }
        .btn-cashout { background: linear-gradient(135deg, var(--neon-green), #2ecc71); color: #000; animation: pulse 0.8s infinite; }
        .btn-roulette { background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); color: #fff; font-size: 18px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .timer-text { margin-top: 10px; font-size: 12px; color: #555; text-align: center; }
        .timer-text.ready { color: var(--neon-green); }

        /* Toast */
        .toast-container { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 5px; }
        .toast { 
            background: rgba(0,0,0,0.95); padding: 12px 20px; border-radius: 10px; 
            border: 1px solid; font-weight: 900; font-size: 13px;
        }
        .toast.success { border-color: var(--neon-green); color: var(--neon-green); }
        .toast.error { border-color: var(--neon-red); color: var(--neon-red); }

        /* Confetti */
        .confetti { position: fixed; width: 10px; height: 10px; animation: confetti-fall 3s ease-out forwards; z-index: 999; }
        @keyframes confetti-fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        
        .particle { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 1000; animation: particleFly 1s ease-out forwards; }
        @keyframes particleFly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
    </style>
</head>
<body>

    <div class="balance-top">
        <div class="bal coins">🪙 <span id="coins">0</span></div>
        <div class="bal crystals">💎 <span id="crys">0</span></div>
    </div>

    <div class="income-bar" id="incomeBar" style="display: none;">
        <span>💰</span>
        <span id="incomeAmount">0</span> 🪙/сек
    </div>

    <div class="game-nav">
        <button class="nav-btn" onclick="location.href='index.html'">🏠 БАЗА</button>
        <button id="nav-wheel" class="nav-btn active" onclick="switchGame('wheel')">🎡 КОЛЕСО</button>
        <button id="nav-crash" class="nav-btn" onclick="switchGame('crash')">🚀 CRASH</button>
        <button id="nav-roulette" class="nav-btn" onclick="switchGame('roulette')">🎰 РУЛЕТКА</button>
    </div>

    <!-- КОЛЕСО -->
    <div id="section-wheel" class="game-section active">
        <div class="mode-selector">
            <div id="tab-norm" class="mode-tab active-norm" onclick="setWheelMode('norm')">🪙 GOLD</div>
            <div id="tab-vip" class="mode-tab" onclick="setWheelMode('vip')">💎 VIP</div>
        </div>
        <div class="wheel-box">
            <div class="pointer"></div>
            <div id="wheel-border" class="wheel-border norm-glow"></div>
            <svg id="wheel-svg" viewBox="0 0 100 100"></svg>
        </div>
        <button id="spinBtn" class="main-btn btn-spin" onclick="spin()">КРУТИТЬ</button>
        <div id="dailyTimer" class="timer-text"></div>
    </div>

    <!-- CRASH -->
    <div id="section-crash" class="game-section">
        <div class="crash-container">
            <div class="crash-area" id="crashArea">
                <svg class="crash-graph" viewBox="0 0 400 300" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:0" />
                        </linearGradient>
                    </defs>
                    <path id="graphFill" class="crash-fill" d="" />
                    <path id="graphLine" class="crash-line" d="" />
                </svg>
                <div id="rocket">🚀</div>
                <div id="multText">1.00x</div>
            </div>
            <div class="crash-controls">
                <div class="bet-row">
                    <input type="number" id="betAmount" class="crash-input" value="1000" step="100" min="100">
                    <button class="quick-btn" onclick="changeBet(0.5)">/2</button>
                    <button class="quick-btn" onclick="changeBet(2)">x2</button>
                    <button class="quick-btn" onclick="maxBet()">MAX</button>
                </div>
                <button id="crashBtn" class="main-btn btn-crash" onclick="crashAction()">🚀 СТАРТ</button>
            </div>
        </div>
    </div>

    <!-- РУЛЕТКА -->
    <div id="section-roulette" class="game-section">
        <div class="roulette-preview">
            <div class="roulette-icon">🎰</div>
            <div class="roulette-title">NEON РУЛЕТКА</div>
            <div class="roulette-features">
                <div class="roulette-feature">🎨 Неоновый стол</div>
                <div class="roulette-feature">💰 Ставки от 100</div>
                <div class="roulette-feature">🎯 Бонусы</div>
            </div>
            <button class="main-btn btn-roulette" onclick="location.href='roulette.html'">ИГРАТЬ</button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

<script>
    // Состояние
    let state = {
        coins: +localStorage.getItem("coins") || 100000,
        crys: +localStorage.getItem("crystals") || 10,
        lastFreeSpin: +localStorage.getItem("lastFreeSpin") || 0
    };

    let isSpinning = false, isFlying = false, wheelMode = 'norm', currentMult = 1.0, crashInt, timerInt, incomeInt;
    let graphPoints = [], startTime = 0;

    const prizes = {
        norm: [
            { n: "50k", v: 50000, t: 'c', color: '#000', text: '#fff' },
            { n: "500k", v: 500000, t: 'c', color: '#1de9b6', text: '#000' },
            { n: "5k", v: 5000, t: 'c', color: '#000', text: '#fff' },
            { n: "1M", v: 1000000, t: 'c', color: '#ffd700', text: '#000' },
            { n: "10k", v: 10000, t: 'c', color: '#000', text: '#fff' },
            { n: "100k", v: 100000, t: 'c', color: '#1de9b6', text: '#000' },
            { n: "25k", v: 25000, t: 'c', color: '#000', text: '#fff' },
            { n: "250k", v: 250000, t: 'c', color: '#1de9b6', text: '#000' }
        ],
        vip: [
            { n: "50", v: 50, t: 'd', color: '#000', text: '#fff' },
            { n: "10k", v: 10000, t: 'd', color: '#d500f9', text: '#fff' },
            { n: "5", v: 5, t: 'd', color: '#000', text: '#fff' },
            { n: "100k", v: 100000, t: 'd', color: '#ff00ff', text: '#fff' },
            { n: "500", v: 500, t: 'd', color: '#000', text: '#fff' },
            { n: "25", v: 25, t: 'd', color: '#d500f9', text: '#fff' },
            { n: "50k", v: 50000, t: 'd', color: '#000', text: '#fff' },
            { n: "100", v: 100, t: 'd', color: '#d500f9', text: '#fff' }
        ]
    };

    // Инициализация
    renderWheel(); updateUI(); startTimer(); startIncome();

    // Пассивный доход
    function startIncome() {
        updateIncome();
        incomeInt = setInterval(() => {
            const income = calculateIncome();
            if(income > 0) {
                state.coins += income;
                saveState();
                updateUI();
            }
        }, 1000);
    }

    function calculateIncome() {
        const incomes = JSON.parse(localStorage.getItem("incomes")) || {};
        let total = 0;
        if(incomes.startup) total += incomes.startup * 2;
        if(incomes.market) total += incomes.market * 15;
        if(incomes.factory) total += incomes.factory * 120;
        if(incomes.oil) total += incomes.oil * 1000;
        if(incomes.bank) total += incomes.bank * 15000;
        return total;
    }

    function updateIncome() {
        const income = calculateIncome();
        const bar = document.getElementById('incomeBar');
        if(income > 0) {
            bar.style.display = 'flex';
            document.getElementById('incomeAmount').textContent = income.toLocaleString();
        } else {
            bar.style.display = 'none';
        }
    }

    // Колесо
    function renderWheel() {
        const svg = document.getElementById("wheel-svg");
        svg.innerHTML = "";
        const data = prizes[wheelMode];
        data.forEach((p, i) => {
            const startAngle = i * 45, endAngle = (i + 1) * 45;
            const x1 = 50 + 50 * Math.cos(Math.PI * startAngle / 180), y1 = 50 + 50 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 50 + 50 * Math.cos(Math.PI * endAngle / 180), y2 = 50 + 50 * Math.sin(Math.PI * endAngle / 180);
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M 50 50 L ${x1} ${y1} A 50 50 0 0 1 ${x2} ${y2} Z`);
            path.setAttribute("fill", p.color);
            path.setAttribute("stroke", "#222");
            svg.appendChild(path);
            const textAngle = startAngle + 22.5;
            const tx = 50 + 35 * Math.cos(Math.PI * textAngle / 180), ty = 50 + 35 * Math.sin(Math.PI * textAngle / 180);
            const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t.setAttribute("x", tx); t.setAttribute("y", ty); t.setAttribute("fill", p.text);
            t.setAttribute("font-size", "4"); t.setAttribute("font-weight", "900"); t.setAttribute("text-anchor", "middle");
            t.setAttribute("transform", `rotate(${textAngle}, ${tx}, ${ty})`);
            t.textContent = p.n;
            svg.appendChild(t);
        });
    }

    function spin() {
        if(isSpinning) return;
        let isFree = (wheelMode === 'norm' && (Date.now() - state.lastFreeSpin >= 86400000));
        let cost = wheelMode === 'norm' ? (isFree ? 0 : 50000) : 100;

        if(wheelMode === 'norm' && state.coins < cost && !isFree) return showToast("Мало монет!", "error");
        if(wheelMode === 'vip' && state.crys < cost) return showToast("Мало кристаллов!", "error");

        if(cost === 0) { 
            state.lastFreeSpin = Date.now(); 
            localStorage.setItem("lastFreeSpin", state.lastFreeSpin);
            showToast("🎁 Бесплатная прокрутка!", "success");
        } else { 
            wheelMode === 'norm' ? state.coins -= cost : state.crys -= cost; 
        }

        isSpinning = true; 
        document.getElementById('spinBtn').disabled = true;
        saveState(); updateUI();
        
        const svg = document.getElementById("wheel-svg");
        let rand = Math.random() * 100, sec = (rand < 3) ? 3 : (rand < 15 ? 1 : [0,2,4,5,6,7][Math.floor(Math.random()*6)]);
        const totalRot = 3600 + (sec * 45);
        svg.style.transition = "transform 6s cubic-bezier(0.15, 0, 0.1, 1)";
        svg.style.transform = `rotate(${totalRot - 90}deg)`;

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
            const p = prizes[wheelMode][sec];
            p.t === 'c' ? state.coins += p.v : state.crys += p.v;
            
            showToast(`🎉 ВЫИГРЫШ: ${p.n}!`, "success");
            createConfetti();
            createParticles(window.innerWidth/2, window.innerHeight/2, p.t === 'c' ? '#ffd700' : '#00d2ff');
            
            saveState(); updateUI();
            svg.style.transition = "none"; 
            svg.style.transform = `rotate(${(sec * 45) - 90}deg)`;
        }, 6100);
    }

    function setWheelMode(m) { 
        if(isSpinning) return; 
        wheelMode = m; 
        document.getElementById('tab-norm').className = m==='norm' ? 'mode-tab active-norm' : 'mode-tab';
        document.getElementById('tab-vip').className = m==='vip' ? 'mode-tab active-vip' : 'mode-tab';
        document.getElementById('wheel-border').className = m==='norm' ? 'wheel-border norm-glow' : 'wheel-border vip-glow';
        updateUI(); renderWheel(); 
    }

    // Crash
    function changeBet(multiplier) {
        const input = document.getElementById("betAmount");
        let val = +input.value * multiplier;
        val = Math.max(100, Math.min(val, state.coins));
        input.value = Math.floor(val);
    }

    function maxBet() {
        document.getElementById("betAmount").value = Math.max(100, Math.floor(state.coins));
    }

    function crashAction() {
        const btn = document.getElementById("crashBtn"), r = document.getElementById("rocket"), d = document.getElementById("multText");
        const line = document.getElementById('graphLine'), fill = document.getElementById('graphFill');
        
        if(!isFlying) {
            let bet = +document.getElementById("betAmount").value;
            if(bet > state.coins || bet <= 0) return showToast("Некорректная ставка!", "error");
            
            state.coins -= bet; saveState(); updateUI();
            isFlying = true; currentMult = 1.0;
            graphPoints = [[0, 300]]; startTime = Date.now();
            
            btn.textContent = "💰 ЗАБРАТЬ"; btn.className = "main-btn btn-cashout";
            r.style.display = "block"; r.style.left = "10%"; r.style.bottom = "10%";
            d.style.color = "#fff";
            
            let boom = 1.0 + (Math.pow(Math.random(), 2) * 15);
            if(Math.random() > 0.9) boom = 20 + Math.random() * 30;
            
            crashInt = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                currentMult = Math.pow(1.05 + (elapsed * 0.01), elapsed);
                
                d.textContent = currentMult.toFixed(2) + "x";
                d.style.color = currentMult > 5 ? '#ff8c00' : currentMult > 2 ? '#00d2ff' : '#fff';
                
                const x = Math.min(elapsed * 25, 400);
                const y = 300 - Math.min((currentMult - 1) * 25, 280);
                graphPoints.push([x, y]);
                
                let pathD = `M ${graphPoints[0][0]} ${graphPoints[0][1]}`;
                for(let i = 1; i < graphPoints.length; i++) pathD += ` L ${graphPoints[i][0]} ${graphPoints[i][1]}`;
                line.setAttribute("d", pathD);
                fill.setAttribute("d", pathD + ` L ${x} 300 L 0 300 Z`);
                
                const rx = Math.min(10 + (elapsed * 3), 85);
                const ry = Math.min(10 + (currentMult * 2), 85);
                const wobble = Math.sin(elapsed * 10) * 3;
                r.style.left = rx + "%";
                r.style.bottom = ry + "%";
                r.style.transform = `rotate(${45 + wobble}deg)`;
                
                if(currentMult >= boom) {
                    clearInterval(crashInt); isFlying = false;
                    d.textContent = "💥 BOOM!"; 
                    d.style.color = "#ff4d4d";
                    r.textContent = "💥";
                    showToast("💥 Ракета взорвалась!", "error");
                    
                    setTimeout(() => { 
                        r.style.display="none"; r.textContent="🚀"; 
                        btn.textContent="🚀 СТАРТ"; btn.className="main-btn btn-crash"; 
                        d.textContent="1.00x"; d.style.color = "#fff";
                        line.setAttribute("d", ""); fill.setAttribute("d", "");
                    }, 2000);
                }
            }, 50);
        } else {
            clearInterval(crashInt); isFlying = false;
            let win = Math.floor(+document.getElementById("betAmount").value * currentMult);
            state.coins += win;
            saveState(); updateUI();
            showToast(`💰 Забрано: ${win.toLocaleString()} 🪙`, "success");
            
            r.style.transition = "all 0.5s ease-in";
            r.style.left = "150%"; r.style.bottom = "150%";
            
            setTimeout(() => {
                r.style.display="none"; r.style.transition = "none";
                btn.textContent = "🚀 СТАРТ"; btn.className = "main-btn btn-crash";
                line.setAttribute("d", ""); fill.setAttribute("d", "");
            }, 500);
        }
    }

    // UI
    function updateUI() {
        document.getElementById("coins").textContent = Math.floor(state.coins).toLocaleString();
        document.getElementById("crys").textContent = state.crys.toLocaleString();
        
        const btn = document.getElementById("spinBtn");
        const isFree = (wheelMode === 'norm' && (Date.now() - state.lastFreeSpin >= 86400000));
        
        if(wheelMode === 'norm') {
            btn.textContent = isFree ? "🎁 БЕСПЛАТНО" : "КРУТИТЬ (50k 🪙)";
            btn.className = isFree ? "main-btn btn-free" : "main-btn btn-spin";
        } else {
            btn.textContent = "КРУТИТЬ (100 💎)";
            btn.className = "main-btn btn-vip";
        }
        
        updateIncome();
    }

    function startTimer() {
        updateTimer();
        timerInt = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        const timerEl = document.getElementById('dailyTimer');
        const timeLeft = 86400000 - (Date.now() - state.lastFreeSpin);
        
        if(timeLeft <= 0) {
            timerEl.textContent = "🎁 Бесплатная прокрутка доступна!";
            timerEl.classList.add('ready');
        } else {
            const hours = Math.floor(timeLeft / 3600000);
            const mins = Math.floor((timeLeft % 3600000) / 60000);
            const secs = Math.floor((timeLeft % 60000) / 1000);
            timerEl.textContent = `⏱️ До бесплатной: ${hours}ч ${mins}м ${secs}с`;
            timerEl.classList.remove('ready');
        }
    }

    function switchGame(g) {
        if(isSpinning || isFlying) return showToast("Дождитесь окончания игры!", "error");
        document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('section-'+g).classList.add('active');
        document.getElementById('nav-'+g).classList.add('active');
    }

    // Вспомогательные
    function showToast(msg, type='info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function createConfetti() {
        const colors = ['#ffd700', '#00d2ff', '#9d00ff', '#39ff14', '#ff00ff', '#ff4d4d'];
        for(let i=0; i<30; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDelay = Math.random() * 0.5 + 's';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    function createParticles(x, y, color) {
        for(let i = 0; i < 12; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.background = color;
            const angle = (Math.PI * 2 * i) / 12;
            const velocity = 80 + Math.random() * 80;
            p.style.setProperty('--tx', Math.cos(angle) * velocity + 'px');
            p.style.setProperty('--ty', Math.sin(angle) * velocity + 'px');
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }
    }

    function saveState() { 
        localStorage.setItem("coins", state.coins); 
        localStorage.setItem("crystals", state.crys); 
    }
</script>
</body>
</html>
