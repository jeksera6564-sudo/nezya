<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON CASINO — FULL WORKING</title>
    <style>
        :root {
            --gold: #ffd700;
            --neon-blue: #00d2ff;
            --neon-purple: #9d00ff;
            --neon-red: #ff4d4d;
            --neon-green: #39ff14;
            --neon-pink: #ff00ff;
            --bg: #05050a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden; padding-bottom: 50px;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
        .balance-top { 
            display: flex; gap: 10px; z-index: 100; background: rgba(0,0,0,0.95); 
            padding: 15px; width: 100%; justify-content: center; 
            border-bottom: 2px solid #1a1a1a; position: sticky; top: 0;
        }
        .bal { 
            background: #000; padding: 8px 15px; border-radius: 12px; 
            border: 1px solid var(--gold); font-weight: 900; min-width: 110px; 
            text-align: center; font-size: 13px; transition: all 0.3s;
        }
        .bal.changed { transform: scale(1.1); filter: brightness(1.5); }

        /* --- НАВИГАЦИЯ --- */
        .game-nav { 
            display: flex; gap: 5px; margin: 15px 0; background: #111; 
            padding: 5px; border-radius: 15px; border: 1px solid #333; 
            width: 95%; max-width: 500px;
        }
        .nav-btn { 
            padding: 10px 5px; border-radius: 10px; border: none; 
            background: transparent; color: #555; font-weight: 900; 
            cursor: pointer; transition: 0.3s; font-size: 9px; 
            flex: 1; text-transform: uppercase;
        }
        .nav-btn.active { background: var(--neon-blue); color: #000; box-shadow: 0 0 10px var(--neon-blue); }

        /* --- КОНТЕНТ --- */
        .game-section { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn 0.3s ease; }
        .game-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- КОЛЕСО (SVG) --- */
        .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-tab { 
            padding: 8px 20px; border-radius: 20px; border: 2px solid #222; 
            background: #000; color: #444; cursor: pointer; font-size: 11px; font-weight: 900;
            transition: all 0.3s;
        }
        .mode-tab.active-norm { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .mode-tab.active-vip { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }

        .wheel-box { position: relative; width: 300px; height: 300px; margin-bottom: 20px; }
        #wheel-svg { width: 100%; height: 100%; transform: rotate(-90deg); transition: transform 6s cubic-bezier(0.15, 0, 0.1, 1); }
        .pointer { 
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); 
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; 
            border-top: 30px solid #fff; z-index: 20; filter: drop-shadow(0 0 5px #fff);
        }
        .wheel-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 8px solid #111; z-index: 10; pointer-events: none; }
        .norm-glow { border-color: var(--neon-green); box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        .vip-glow { border-color: var(--neon-pink); box-shadow: 0 0 20px rgba(255, 0, 255, 0.2); }

        /* --- КРАШ --- */
        .crash-area { 
            width: 90%; max-width: 400px; height: 220px; background: #000; 
            border: 2px solid #111; border-radius: 20px; position: relative; 
            overflow: hidden; margin-bottom: 20px; display: flex; 
            align-items: center; justify-content: center;
        }
        #rocket { position: absolute; bottom: 10%; left: 10%; font-size: 35px; display: none; z-index: 5; transition: 0.1s linear; filter: drop-shadow(0 0 10px var(--neon-blue)); }
        #multText { font-size: 55px; font-weight: 900; z-index: 10; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); }
        .crash-input { 
            background: #000; border: 2px solid #222; color: #fff; 
            padding: 15px; width: 280px; border-radius: 15px; 
            text-align: center; font-size: 18px; margin-bottom: 15px; outline: none;
            transition: border-color 0.3s;
        }
        .crash-input:focus { border-color: var(--neon-blue); }

        /* --- КНОПКИ --- */
        .main-btn { width: 280px; padding: 18px; border-radius: 15px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-spin { background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green); }
        .btn-spin:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 25px var(--neon-green); }
        .btn-free { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); animation: pulse-gold 1s infinite; }
        .btn-vip { background: var(--neon-pink); color: #fff; box-shadow: 0 0 15px var(--neon-pink); }
        .btn-vip:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 25px var(--neon-pink); }
        .btn-crash { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .btn-crash:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 25px var(--neon-blue); }
        .btn-cashout { background: var(--neon-green); color: #000; animation: pulse 0.5s infinite; box-shadow: 0 0 20px var(--neon-green); }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 20px var(--gold); } 50% { box-shadow: 0 0 40px var(--gold); } 100% { box-shadow: 0 0 20px var(--gold); } }

        .timer-text { margin-top: 10px; font-size: 11px; color: #555; }
        .timer-text.ready { color: var(--neon-green); font-weight: bold; }

        /* --- РУЛЕТКА --- */
        .dev-box { padding: 40px; text-align: center; background: linear-gradient(135deg, #111, #1a1a1a); border-radius: 20px; border: 2px dashed #333; width: 90%; }
        .dev-box h2 { text-shadow: 0 0 20px var(--neon-purple); }

        /* --- TOAST УВЕДОМЛЕНИЯ --- */
        .toast-container { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { 
            background: rgba(0,0,0,0.95); padding: 15px 25px; border-radius: 12px; 
            border: 1px solid; font-weight: bold; animation: slideDown 0.3s ease; 
            backdrop-filter: blur(10px);
        }
        .toast.success { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 20px rgba(57,255,20,0.3); }
        .toast.error { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 20px rgba(255,77,77,0.3); }
        .toast.info { border-color: var(--neon-blue); color: var(--neon-blue); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- КОНФЕТТИ --- */
        .confetti { position: fixed; width: 10px; height: 10px; animation: confetti-fall 3s ease-out forwards; z-index: 999; }
        @keyframes confetti-fall { 
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } 
        }

        /* --- СБРОС --- */
        .reset-btn { position: fixed; bottom: 10px; right: 10px; background: #222; border: 1px solid #444; color: #666; padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; opacity: 0.5; }
        .reset-btn:hover { opacity: 1; color: #fff; }

        /* --- ГРАФИК КРАША --- */
        .crash-graph { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; opacity: 0.3; }
        .crash-line { stroke: var(--neon-blue); stroke-width: 2; fill: none; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2s ease forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
</head>
<body>

    <div class="balance-top">
        <div class="bal" id="bal-coins" style="border-color: var(--gold);">🪙 <span id="coins">0</span></div>
        <div class="bal" id="bal-crys" style="border-color: var(--neon-blue);">💎 <span id="crys">0</span></div>
    </div>

    <div class="game-nav">
        <button class="nav-btn" onclick="location.href='index.html'">🏠 ГЛАВНАЯ</button>
        <button id="nav-wheel" class="nav-btn active" onclick="switchGame('wheel')">КОЛЕСО</button>
        <button id="nav-crash" class="nav-btn" onclick="switchGame('crash')">CRASH 🚀</button>
        <button id="nav-roulette" class="nav-btn" onclick="switchGame('roulette')">РУЛЕТКА 🎡</button>
    </div>

    <div id="section-wheel" class="game-section active">
        <div class="mode-selector">
            <div id="tab-norm" class="mode-tab active-norm" onclick="setWheelMode('norm')">GOLD</div>
            <div id="tab-vip" class="mode-tab" onclick="setWheelMode('vip')">VIP</div>
        </div>
        <div class="wheel-box">
            <div class="pointer"></div>
            <div id="wheel-border" class="wheel-border norm-glow"></div>
            <svg id="wheel-svg" viewBox="0 0 100 100"></svg>
        </div>
        <button id="spinBtn" class="main-btn btn-spin" onclick="spin()">КРУТИТЬ</button>
        <div id="dailyTimer" class="timer-text"></div>
    </div>

    <div id="section-crash" class="game-section">
        <div class="crash-area">
            <svg class="crash-graph" viewBox="0 0 400 220" preserveAspectRatio="none">
                <path id="crash-path" class="crash-line" d="M 0 220 Q 100 200 200 150 T 400 50" style="display:none;"/>
            </svg>
            <div id="rocket">🚀</div>
            <div id="multText">1.00x</div>
        </div>
        <input type="number" id="betAmount" class="crash-input" value="1000" min="1">
        <button id="crashBtn" class="main-btn btn-crash" onclick="crashAction()">ПОСТАВИТЬ</button>
    </div>

    <div id="section-roulette" class="game-section">
        <div class="dev-box">
            <h2 style="color: var(--neon-purple)">🎡 РУЛЕТКА</h2>
            <p style="color: #666; margin-top: 10px;">В РАЗРАБОТКЕ</p>
            <p style="color: #444; margin-top: 5px; font-size: 12px;">Скоро будет доступно</p>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <button class="reset-btn" onclick="resetGame()" title="Сбросить прогресс">↺</button>

    <audio id="sound-spin" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUqXh8bllHAU2k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
    </audio>

<script>
    // --- СОСТОЯНИЕ ---
    let state = {
        coins: +localStorage.getItem("coins") || 100000,
        crys: +localStorage.getItem("crystals") || 10,
        lastFreeSpin: +localStorage.getItem("lastFreeSpin") || 0
    };

    let isSpinning = false, isFlying = false, wheelMode = 'norm', currentMult = 1.0, crashInt, timerInt;

    const prizes = {
        norm: [
            { n: "50k", v: 50000, t: 'c', color: '#000', text: '#fff' },
            { n: "500k", v: 500000, t: 'c', color: '#1de9b6', text: '#000' },
            { n: "5k", v: 5000, t: 'c', color: '#000', text: '#fff' },
            { n: "1M", v: 1000000, t: 'c', color: '#ffd700', text: '#000' },
            { n: "10k", v: 10000, t: 'c', color: '#000', text: '#fff' },
            { n: "100k", v: 100000, t: 'c', color: '#1de9b6', text: '#000' },
            { n: "25k", v: 25000, t: 'c', color: '#000', text: '#fff' },
            { n: "250k", v: 250000, t: 'c', color: '#1de9b6', text: '#000' }
        ],
        vip: [
            { n: "50", v: 50, t: 'd', color: '#000', text: '#fff' },
            { n: "10k", v: 10000, t: 'd', color: '#d500f9', text: '#fff' },
            { n: "5", v: 5, t: 'd', color: '#000', text: '#fff' },
            { n: "100k", v: 100000, t: 'd', color: '#ff00ff', text: '#fff' },
            { n: "500", v: 500, t: 'd', color: '#000', text: '#fff' },
            { n: "25", v: 25, t: 'd', color: '#d500f9', text: '#fff' },
            { n: "50k", v: 50000, t: 'd', color: '#000', text: '#fff' },
            { n: "100", v: 100, t: 'd', color: '#d500f9', text: '#fff' }
        ]
    };

    // --- ИНИЦИАЛИЗАЦИЯ ---
    renderWheel(); updateUI(); startTimer();

    // --- КОЛЕСО ---
    function renderWheel() {
        const svg = document.getElementById("wheel-svg");
        svg.innerHTML = "";
        const data = prizes[wheelMode];
        data.forEach((p, i) => {
            const startAngle = i * 45, endAngle = (i + 1) * 45;
            const x1 = 50 + 50 * Math.cos(Math.PI * startAngle / 180), y1 = 50 + 50 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 50 + 50 * Math.cos(Math.PI * endAngle / 180), y2 = 50 + 50 * Math.sin(Math.PI * endAngle / 180);
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M 50 50 L ${x1} ${y1} A 50 50 0 0 1 ${x2} ${y2} Z`);
            path.setAttribute("fill", p.color);
            path.setAttribute("stroke", "#222");
            svg.appendChild(path);
            const textAngle = startAngle + 22.5;
            const tx = 50 + 35 * Math.cos(Math.PI * textAngle / 180), ty = 50 + 35 * Math.sin(Math.PI * textAngle / 180);
            const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t.setAttribute("x", tx); t.setAttribute("y", ty); t.setAttribute("fill", p.text);
            t.setAttribute("font-size", "4"); t.setAttribute("font-weight", "900"); t.setAttribute("text-anchor", "middle");
            t.setAttribute("transform", `rotate(${textAngle}, ${tx}, ${ty})`);
            t.textContent = p.n;
            svg.appendChild(t);
        });
    }

    function spin() {
        if(isSpinning) return;
        let isFree = (wheelMode === 'norm' && (Date.now() - state.lastFreeSpin >= 86400000));
        let cost = wheelMode === 'norm' ? (isFree ? 0 : 50000) : 100;

        if(wheelMode === 'norm' && state.coins < cost && !isFree) return showToast("Мало монет!", "error");
        if(wheelMode === 'vip' && state.crys < cost) return showToast("Мало кристаллов!", "error");

        playSound('spin');
        if(cost === 0) { 
            state.lastFreeSpin = Date.now(); 
            localStorage.setItem("lastFreeSpin", state.lastFreeSpin);
            showToast("🎁 Бесплатная прокрутка!", "success");
        } else { 
            wheelMode === 'norm' ? state.coins -= cost : state.crys -= cost; 
        }

        isSpinning = true; 
        document.getElementById('spinBtn').disabled = true;
        saveState(); updateUI();
        
        const svg = document.getElementById("wheel-svg");
        let rand = Math.random() * 100, sec = (rand < 3) ? 3 : (rand < 15 ? 1 : [0,2,4,5,6,7][Math.floor(Math.random()*6)]);
        const totalRot = 3600 + (sec * 45);
        svg.style.transition = "transform 6s cubic-bezier(0.15, 0, 0.1, 1)";
        svg.style.transform = `rotate(${totalRot - 90}deg)`;

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;
            const p = prizes[wheelMode][sec];
            p.t === 'c' ? state.coins += p.v : state.crys += p.v;
            
            showToast(`🎉 ВЫИГРЫШ: ${p.n}!`, "success");
            createConfetti();
            playSound('win');
            
            saveState(); updateUI();
            svg.style.transition = "none"; 
            svg.style.transform = `rotate(${(sec * 45) - 90}deg)`;
        }, 6100);
    }

    function setWheelMode(m) { 
        if(isSpinning) return; 
        wheelMode = m; 
        document.getElementById('tab-norm').className = m==='norm' ? 'mode-tab active-norm' : 'mode-tab';
        document.getElementById('tab-vip').className = m==='vip' ? 'mode-tab active-vip' : 'mode-tab';
        document.getElementById('wheel-border').className = m==='norm' ? 'wheel-border norm-glow' : 'wheel-border vip-glow';
        updateUI(); renderWheel(); 
    }

    // --- КРАШ ---
    function crashAction() {
        const btn = document.getElementById("crashBtn"), r = document.getElementById("rocket"), d = document.getElementById("multText");
        const path = document.getElementById('crash-path');
        
        if(!isFlying) {
            let bet = +document.getElementById("betAmount").value;
            if(bet > state.coins || bet <= 0) return showToast("Некорректная ставка!", "error");
            
            state.coins -= bet; saveState(); updateUI();
            isFlying = true; currentMult = 1.0;
            btn.textContent = "ЗАБРАТЬ"; btn.className = "main-btn btn-cashout";
            r.style.display = "block"; r.style.left = "10%"; r.style.bottom = "10%";
            path.style.display = "block";
            path.style.animation = 'none';
            path.offsetHeight; // trigger reflow
            path.style.animation = null;
            
            let boom = 1 + Math.random() * Math.random() * 10;
            crashInt = setInterval(() => {
                currentMult += 0.01 + (currentMult/200);
                d.textContent = currentMult.toFixed(2) + "x";
                r.style.left = Math.min(10 + (currentMult * 5), 80) + "%";
                r.style.bottom = Math.min(10 + (currentMult * 7), 70) + "%";
                
                if(currentMult >= boom) {
                    clearInterval(crashInt); isFlying = false;
                    d.textContent = "💥 BOOM!"; 
                    r.textContent = "💥";
                    playSound('crash');
                    showToast("💥 Ракета взорвалась!", "error");
                    
                    setTimeout(() => { 
                        r.style.display="none"; 
                        r.textContent="🚀"; 
                        btn.textContent="ПОСТАВИТЬ"; 
                        btn.className="main-btn btn-crash"; 
                        d.textContent="1.00x";
                        path.style.display = "none";
                    }, 2000);
                }
            }, 100);
            playSound('start');
        } else {
            clearInterval(crashInt); isFlying = false;
            let win = Math.floor(+document.getElementById("betAmount").value * currentMult);
            state.coins += win;
            saveState(); updateUI();
            showToast(`💰 Забрано: ${win.toLocaleString()} 🪙`, "success");
            playSound('cashout');
            btn.textContent = "ПОСТАВИТЬ"; btn.className = "main-btn btn-crash"; 
            r.style.display="none";
            path.style.display = "none";
        }
    }

    // --- UI ---
    function updateUI() {
        const coinsEl = document.getElementById("coins"), crysEl = document.getElementById("crys");
        const oldCoins = coinsEl.textContent, oldCrys = crysEl.textContent;
        
        coinsEl.textContent = Math.floor(state.coins).toLocaleString();
        crysEl.textContent = state.crys.toLocaleString();
        
        if(oldCoins !== coinsEl.textContent) animateBalance('bal-coins');
        if(oldCrys !== crysEl.textContent) animateBalance('bal-crys');
        
        const btn = document.getElementById("spinBtn");
        const isFree = (wheelMode === 'norm' && (Date.now() - state.lastFreeSpin >= 86400000));
        
        if(wheelMode === 'norm') {
            btn.textContent = isFree ? "🎁 БЕСПЛАТНО" : "КРУТИТЬ (50k 🪙)";
            btn.className = isFree ? "main-btn btn-free" : "main-btn btn-spin";
        } else {
            btn.textContent = "КРУТИТЬ (100 💎)";
            btn.className = "main-btn btn-vip";
        }
    }

    function animateBalance(id) {
        const el = document.getElementById(id);
        el.classList.add('changed');
        setTimeout(() => el.classList.remove('changed'), 300);
    }

    function startTimer() {
        updateTimer();
        timerInt = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        const timerEl = document.getElementById('dailyTimer');
        const timeLeft = 86400000 - (Date.now() - state.lastFreeSpin);
        
        if(timeLeft <= 0) {
            timerEl.textContent = "🎁 Бесплатная прокрутка доступна!";
            timerEl.classList.add('ready');
        } else {
            const hours = Math.floor(timeLeft / 3600000);
            const mins = Math.floor((timeLeft % 3600000) / 60000);
            const secs = Math.floor((timeLeft % 60000) / 1000);
            timerEl.textContent = `⏱️ До бесплатной: ${hours}ч ${mins}м ${secs}с`;
            timerEl.classList.remove('ready');
        }
    }

    function switchGame(g) {
        if(isSpinning || isFlying) return showToast("Дождитесь окончания игры!", "error");
        document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('section-'+g).classList.add('active');
        document.getElementById('nav-'+g).classList.add('active');
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ---
    function showToast(msg, type='info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function createConfetti() {
        const colors = ['#ffd700', '#00d2ff', '#9d00ff', '#39ff14', '#ff00ff'];
        for(let i=0; i<30; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDelay = Math.random() * 0.5 + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    function playSound(type) {
        // Заглушки для звуков - можно заменить на реальные файлы
